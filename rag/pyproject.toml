[project]
name = "cahier-rag"
version = "0.1.0"
description = "Socle local autonome du RAG Cahier de doléances"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "SQLAlchemy==2.0.43",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.4",
    "alembic==1.16.5",
]

[project.scripts]
cahier-rag-judge = "cahier_rag.judges.cli:main"
cahier-rag-campaign = "cahier_rag.annotation.campaign_cli:main"
cahier-rag-hybrid = "cahier_rag.search.hybrid.cli:main"
cahier-rag-vector = "cahier_rag.vector.cli:main"
cahier-rag-embed = "cahier_rag.embeddings.cli:main"
cahier-rag-prepare = "cahier_rag.representations.cli:main"
cahier-rag-annotate = "cahier_rag.annotation.cli:main"
cahier-rag = "cahier_rag.__main__:main"
cahier-rag-eval = "cahier_rag.evaluation.cli:main"
cahier-rag-search = "cahier_rag.search.cli:main"
cahier-rag-flex = "cahier_rag.search.flexible_cli:main"

[project.optional-dependencies]
reranking = [
    "torch==2.10.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "psutil==7.2.2",
]
judges = [
    "torch==2.10.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "psutil==7.2.2",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
]
embeddings = [
    "torch==2.10.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "psutil==7.2.2",
]

annotation = [
    "fastapi==0.143.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.1"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: PostgreSQL isolé explicitement configuré par RAG_TEST_DATABASE_URL"]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "reranking", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", extra = "embeddings", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", extra = "judges", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
