[project]
name = "cahier-rag"
version = "0.1.0"
description = "Socle local autonome du RAG Cahier de doléances"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "SQLAlchemy==2.0.43",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.4",
]

[project.scripts]
cahier-rag = "cahier_rag.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.1"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: PostgreSQL isolé explicitement configuré par RAG_TEST_DATABASE_URL"]

