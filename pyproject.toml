[project]
name = "cahier-de-doleances-backend"
version = "0.1.0"
description = "API et ingestion du Cahier de doléances"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cahier-rag",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.35.0",
    "gunicorn==23.0.0",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "pydantic==2.11.7",
    "python-slugify==8.0.4",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.4",
    "starlette==1.7.0",
    "uvicorn-worker==0.3.0",
    "PyJWT==2.15.1",
    "mailjet-rest==1.3.4",
    "email-validator==2.2.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
search = ["cahier-rag[embeddings]", "torch==2.10.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.0",
]

[tool.uv]
# Application exécutée depuis le dépôt : conserver les imports app/ et ingest/.
package = false
required-version = "==0.13.1"
# Le RAG conserve son verrou expérimental ; l'application verrouille aussi son extra GPU.

[tool.uv.sources]
cahier-rag = { path = "rag", editable = true }
torch = [{ index = "pytorch-cu128", extra = "search", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
