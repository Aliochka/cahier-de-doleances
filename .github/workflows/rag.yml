name: RAG foundations

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: rag/.python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: rag/uv.lock
      - name: Install locked RAG dependencies
        run: uv sync --locked --dev
      - name: Lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Unit tests without services
        run: uv run --locked python -m pytest
      - name: Offline diagnostic
        run: uv run --locked python -m cahier_rag check-config --env-file .env.example
