<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratoire 1789</title><link rel="stylesheet" href="/lab.css"><script src="/lab.js" defer></script></head>
<body><main><header><h1>Laboratoire de recherche · Cahiers de 1789</h1><p>Expérimentation locale sur une collection non publiée. Les passages sont des extraits techniques, pas des articles historiques.</p></header>
<form id="search"><label>Recherche <input name="q" id="q" value="Agen agriculture" maxlength="512" required></label><label>Mode <select name="mode"><option value="hybrid">Hybride</option><option value="lexical">Lexical</option><option value="vector">Vectoriel exact</option><option value="compare">Comparer les trois classements</option></select></label><label>Profondeur documentaire <select name="depth"><option>50</option><option>100</option><option>200</option></select></label><label>Volume <select name="volume"><option value="">Tous</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Ordre <select name="estate"><option value="">Tous</option><option>clergé</option><option>noblesse</option><option>tiers état</option></select></label><label>Lieu / titre <input name="place" maxlength="150"></label><button id="submit">Rechercher</button></form>
<p id="status" role="status" aria-live="polite"></p><details><summary>Classements et mesures techniques</summary><pre id="technical"></pre></details><section id="comparison" hidden><h2>Premiers cahiers par branche</h2><div id="branches"></div></section><section id="results" aria-label="Résultats"></section><section id="reader" hidden><h2 id="reader-title"></h2><p id="reader-meta"></p><div id="reader-warnings"></div><p id="reader-links"></p><pre id="full-text" tabindex="0"></pre></section></main></body></html>
