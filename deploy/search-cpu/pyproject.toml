# Production CPU lock, independent of the unchanged experimental CUDA locks.
# Tests enforce alignment with root runtime and rag[embeddings] versions.
[project]
name = "cahier-search-cpu-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cahier-rag",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.35.0",
    "gunicorn==23.0.0",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "pydantic==2.11.7",
    "python-slugify==8.0.4",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.4",
    "starlette==1.7.0",
    "uvicorn-worker==0.3.0",
    "PyJWT==2.15.1",
    "mailjet-rest==1.3.4",
    "email-validator==2.2.0",
    "PyYAML==6.0.3",
    "torch==2.10.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.uv]
package = false
required-version = "==0.13.1"
# Preserve shared transitive versions from the application lock at preparation.
constraint-dependencies = [
    "certifi==2026.7.22", "dnspython==2.8.0", "greenlet==3.0.1",
    "pluggy==1.6.0", "websockets==16.1.1",
]

[tool.uv.sources]
cahier-rag = { path = "../../rag", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
