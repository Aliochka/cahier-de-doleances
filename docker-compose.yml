services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/cahier_doleances
      ENV: dev
      CANONICAL_HOST_URL: http://127.0.0.1:8000
    command: sh -c 'alembic upgrade head && gunicorn app.app:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cahier_doleances
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cahier_doleances"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
