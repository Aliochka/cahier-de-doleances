target-version = "py310"
line-length = 100
# Archived experiments retain byte-frozen scripts referenced by provenance hashes.
# Maintained 1789 code (extraction, review and tools) remains checked.
extend-exclude = ["data", "notebooks", "1789/archives"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Published migration imports are kept intact.
"migrations/versions/*.py" = ["E402", "F401", "F841", "I001"]
