<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratoire multicorpus</title><link rel="stylesheet" href="/lab.css"><script src="/multi.js" defer></script></head><body><main>
<header><h1>Laboratoire de recherche multicorpus</h1><p>Expérimentation locale · Grand Débat 2019 et cahiers de 1789 non publiés. Les passages historiques sont des extraits techniques.</p></header>
<form id="search"><label>Recherche<input name="q" value="Suppression des privilèges" maxlength="512" required></label><label>Corpus<select name="corpus"><option value="tous">Tous les corpus</option><option value="2019">Grand Débat 2019</option><option value="1789">Cahiers de 1789</option></select></label><label>Mode<select name="mode"><option value="compare">Comparer les trois classements</option><option value="hybrid">Hybride</option><option value="lexical">Lexical</option><option value="vector">Vectoriel</option></select></label><label>Profondeur documentaire<select name="depth"><option>50</option><option>100</option><option>200</option></select></label>
<label>Question GDN (2019 seul)<input name="question" type="number" min="1"></label><label>Volume (1789 seul)<select name="volume"><option value="">Tous</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Ordre (1789 seul)<select name="estate"><option value="">Tous</option><option>clergé</option><option>noblesse</option><option>tiers état</option></select></label><label>Lieu / titre (1789 seul)<input name="place" maxlength="150"></label><button id="submit">Rechercher</button></form>
<p id="status" role="status" aria-live="polite"></p><button id="h1" type="button">Comparer avec H1 · 2019, profondeur 50</button><p id="h1-status" role="status"></p><details><summary>Temps, statistiques et versions</summary><pre id="technical"></pre></details><section id="comparison" hidden><h2>Premiers documents par branche</h2><div id="branches"></div></section><section id="h1-results" hidden><h2>Référence H1 inchangée · unités avant regroupement</h2><ol id="h1-list"></ol></section><section id="results" aria-label="Résultats"></section><section id="reader" hidden><h2 id="reader-title"></h2><p id="reader-meta"></p><div id="reader-warnings"></div><p id="reader-links"></p><pre id="full-text" tabindex="0"></pre></section></main></body></html>
